[versions]
morphe-patcher = "2.3.0"
# Patcher 2.3.0 asks for smali ac700e1942, but with it :patches:buildAndroid fails (d8:
# "Classpath type already present: com.android.tools.smali.dexlib2.Opcode"). Keep 4220ae75f7 (2026-11-14).
#noinspection GradleDependency
smali = "4220ae75f7"
gson = "2.14.0"
morphe-patches-library = "2.1.1"
agp = "9.1.0"
junit = "4.13.2"

[libraries]
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
morphe-patches-library = { module = "app.morphe:morphe-patches-library", version.ref = "morphe-patches-library" }
# Heval Controls core unit tests (extensions/hevalcontrols/core).
junit = { module = "junit:junit", version.ref = "junit" }

